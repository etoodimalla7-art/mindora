services:
  - type: web
    name: mindora-api
    runtime: python
    plan: free
    rootDir: backend/python_api
    buildCommand: pip install poetry && poetry config virtualenvs.create false && poetry install --only main --no-interaction && alembic upgrade head && python -m scripts.seed_plans
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_BASE_URL
        value: https://mindora-w3jv.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://mindora.dev,https://www.mindora.dev,https://admin.mindora.dev
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_HASH
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
