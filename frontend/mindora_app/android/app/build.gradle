plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")

if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def releaseKeystoreProperties = new Properties()
def releaseKeystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseSigningConfig = releaseKeystorePropertiesFile.exists()

if (hasReleaseSigningConfig) {
    releaseKeystorePropertiesFile.withReader("UTF-8") { reader ->
        releaseKeystoreProperties.load(reader)
    }
}

android {
    namespace "com.example.mindora_app"
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.example.mindora_app"
        minSdkVersion 23
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (hasReleaseSigningConfig) {
            release {
                keyAlias releaseKeystoreProperties["keyAlias"]
                keyPassword releaseKeystoreProperties["keyPassword"]
                storeFile releaseKeystoreProperties["storeFile"]
                    ? file(releaseKeystoreProperties["storeFile"])
                    : null
                storePassword releaseKeystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasReleaseSigningConfig
                ? signingConfigs.release
                : signingConfigs.debug

            minifyEnabled true
            shrinkResources true

            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }
}

flutter {
    source "../.."
}
