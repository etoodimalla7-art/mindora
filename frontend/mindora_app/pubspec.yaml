name: mindora_app
description: MINDORA — AI-powered education platform.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  dio: ^5.5.0
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  record: ^5.1.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Updated to be compatible with flutter_localizations
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# Section 70: icon/splash generation driven by the same brand config
# the app itself reads (core/theme/brand_config.dart) — run
# `dart run flutter_launcher_icons` / `dart run flutter_native_splash:create`
# after dropping real image assets at these paths (see
# docs/ANDROID_RELEASE.md). Placeholder paths only; no image files
# exist at them yet.
flutter_launcher_icons:
  android: true
  image_path: "assets/brand/icon.png"
  min_sdk_android: 23

flutter_native_splash:
  color: "#F7F8FB"
  image: "assets/brand/splash.png"
  android_12:
    color: "#F7F8FB"
    image: "assets/brand/splash.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/
