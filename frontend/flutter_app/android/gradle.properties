# Gradle JVM options — moderate memory + longer timeouts
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Android
android.useAndroidX=true
android.enableJetifier=true

# Kotlin
kotlin.code.style=official

# Gradle daemon settings
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configureondemand=true

# Increase timeouts (helps with slow plugin compilation)
org.gradle.internal.repository.max.tentatives=5
org.gradle.internal.repository.initial.backoff=500

# Disable build scans and telemetry
org.gradle.welcome=never
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
