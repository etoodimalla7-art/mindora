name: mindora_app
description: MINDORA — Intelligent education platform.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1

  # Firebase (push notifications)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  riverpod_annotation: ^2.6.1

  go_router: ^14.6.0

  dio: ^5.7.0

  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  shared_preferences: ^2.3.2
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.4

  file_selector: ^1.0.3
  intl: ^0.20.2
  collection: ^1.18.0
  equatable: ^2.0.5
  logger: ^2.4.0
  uuid: ^4.5.1

  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.3
  flutter_animate: ^4.5.0

  responsive_framework: ^1.5.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/


dependency_overrides:
  web: 0.5.1
