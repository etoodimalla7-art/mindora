# =========================================================
# MINDORA — Local Development Infrastructure (Phase 1–5)
# Postgres (pgvector) + Redis. Object storage is added in Phase 6.
# Usage: docker compose -f infrastructure/docker-compose.yml up -d
# =========================================================

name: mindora-infra

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: mindora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mindora}
      POSTGRES_USER: ${POSTGRES_USER:-mindora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindora_dev_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mindora} -d ${POSTGRES_DB:-mindora}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [mindora-net]

  redis:
    image: redis:7-alpine
    container_name: mindora-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [mindora-net]

  # ---------------------------------------------------------
  # Object storage: intentionally DISABLED until Phase 6.
  # When we reach document upload, we will swap in a maintained
  # S3-compatible image (SeaweedFS or a Quay-hosted MinIO tag).
  # ---------------------------------------------------------

volumes:
  postgres_data:
  redis_data:

networks:
  mindora-net:
    driver: bridge
