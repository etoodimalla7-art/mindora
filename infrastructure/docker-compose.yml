# =========================================================
# MINDORA — Local Development Infrastructure
# Brings up: Postgres (with pgvector), Redis, MinIO, Qdrant(off)
# Usage: docker compose -f infrastructure/docker-compose.yml up -d
# =========================================================

name: mindora-infra

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: mindora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mindora}
      POSTGRES_USER: ${POSTGRES_USER:-mindora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindora_dev_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mindora} -d ${POSTGRES_DB:-mindora}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [mindora-net]

  redis:
    image: redis:7-alpine
    container_name: mindora-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [mindora-net]

  minio:
    image: minio/minio:latest
    container_name: mindora-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [mindora-net]

  minio-init:
    image: minio/mc:latest
    container_name: mindora-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      mc mb -p local/${S3_BUCKET_DOCUMENTS:-mindora-documents} || true;
      mc mb -p local/${S3_BUCKET_AVATARS:-mindora-avatars} || true;
      mc mb -p local/${S3_BUCKET_TEMP:-mindora-temp} || true;
      echo '✅ MinIO buckets ready';
      "
    networks: [mindora-net]

  # Optional: only needed if you later swap pgvector for Qdrant.
  # Left commented so it doesn't consume Codespaces resources by default.
  #
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   container_name: mindora-qdrant
  #   restart: unless-stopped
  #   ports:
  #     - "6333:6333"
  #     - "6334:6334"
  #   volumes:
  #     - qdrant_data:/qdrant/storage
  #   networks: [mindora-net]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  # qdrant_data:

networks:
  mindora-net:
    driver: bridge
