name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: frontend/flutter_app
        run: flutter pub get

      - name: Decode google-services.json
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          ls -la android/app/google-services.json
        working-directory: frontend/flutter_app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Print signing SHA-1
        working-directory: frontend/flutter_app/android
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android -keypass android | grep SHA1

      - name: Build APK
        working-directory: frontend/flutter_app
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://mindora-w3jv.onrender.com/api/v1 \
            --dart-define=APP_ENV=production

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mindora-apk
          path: frontend/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30